<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body><main><header><img src="icon32.png" alt="KNJ"><div><h1>KNJ Internet Monitor</h1><small>Control de conectividad</small></div></header><section class="state"><span id="status">Esperando medición…</span><strong id="latency">—</strong><small>Latencia HTTP</small><small id="lastCheck">Última prueba: —</small></section><label class="toggle"><span>Monitoreo activo</span><input id="enabled" type="checkbox"></label><label class="toggle"><span>Notificaciones de caída y recuperación</span><input id="alerts" type="checkbox"></label><label class="toggle"><span>Avisos de calidad</span><input id="qualityAlerts" type="checkbox"></label><button id="test">Probar ahora</button><details><summary>Alertas por Telegram</summary><label class="toggle"><span>Enviar avisos a Telegram</span><input id="telegramEnabled" type="checkbox"></label><label class="field">Token del bot<input id="telegramToken" type="password" autocomplete="off" placeholder="Token privado"></label><label class="field">ID del chat<input id="telegramChatId" type="text" autocomplete="off" placeholder="ID de Telegram"></label><button id="telegramSave">Guardar configuración</button><button id="telegramTest">Enviar mensaje de prueba</button><small id="telegramStatus"></small></details><details><summary>Registro PostgreSQL</summary><label class="toggle"><span>Guardar mediciones en PostgreSQL</span><input id="dbEnabled" type="checkbox"></label><label class="field">Clave de API (solo en este Chrome)<input id="dbApiKey" type="password" autocomplete="off" placeholder="INGEST_API_KEY de Vercel"></label><button id="dbSave">Guardar configuración</button><button id="dbSync">Probar conexión y sincronizar</button><small id="dbStatus"></small><small>La prueba informa cuántos registros fueron insertados realmente.</small></details><details><summary>Historial de mediciones</summary><ul id="history"></ul></details><footer>Monitoreo automático cada 3 segundos · No es ping ICMP</footer></main><script src="popup.js"></script></body></html>
